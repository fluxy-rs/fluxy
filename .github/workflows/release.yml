name: Release

# Cutting a release is: bump the version in the four declarations that
# check:versions reads, commit, tag vX.Y.Z, push the tag. This workflow checks
# the tag against the declared version, builds the desktop bundles on each
# platform and the signed APK when a keystore is configured, uploads them to a
# draft release, and only undrafts it once every build succeeded.
#
# Android signing secrets (all optional; without them the APK is skipped and the
# desktop bundles still publish):
#   ANDROID_KEYSTORE_BASE64     base64 of the .jks `bun run android:keystore` made
#   ANDROID_KEYSTORE_PASSWORD   the store and key password (one value today)
#   ANDROID_KEY_ALIAS           optional, defaults to `fluxy`
#
# The desktop bundles are unsigned: macOS Gatekeeper and Windows SmartScreen will
# warn until APPLE_* / WINDOWS_* certificates are wired into the build step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: write

# Two release runs race over the same tag and upload to the same release, so
# serialize them and never cancel one halfway through publishing.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      android_signed: ${{ steps.android.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # The tag is a promise about the version; check it before anything is
      # built, because a mismatch is cheap to fix now and expensive after upload.
      - name: Check the tag against the declared version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the declared version v$version"
            exit 1
          fi
          node scripts/release/verify-versions.mjs
      - name: Check whether the Android keystore is configured
        id: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will not be attached"
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  create-release:
    name: Create draft release
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # --generate-notes reads .github/release.yml, so the release notes use the
      # same type labels the labeler applies to pull requests.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading to it"
          else
            # A hyphen marks a pre-release (0.2.0-alpha.1). Without
            # --prerelease GitHub would publish it as the latest stable
            # release, and every user would be offered an alpha as an update.
            args=(--draft --generate-notes --title "$TAG")
            case "$TAG" in
              *-*) args+=(--prerelease) ;;
            esac
            gh release create "$TAG" "${args[@]}"
          fi

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [preflight, create-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # A release-only key: the pull request caches hold debug artefacts, and a
      # hit on one of those is why every release used to rebuild the whole
      # dependency graph in release mode. warm-cache.yml fills this one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/bun-install
        with:
          save: "true"
      - name: Build the bundles
        shell: bash
        run: |
          args=()
          case "$TAG" in
            *-*)
              # A pre-release identifier is a valid app version but not a valid
              # RPM version (no hyphen allowed) or MSI version (numbers only).
              # Build the formats that accept it; a stable tag builds all.
              case "$RUNNER_OS" in
                Linux) args+=(--bundles deb,appimage) ;;
                Windows) args+=(--bundles nsis) ;;
              esac
              ;;
          esac
          bun x tauri build "${args[@]}"
      - name: Upload the bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # macOS still ships bash 3.2, where mapfile does not exist.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find target/release/bundle -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::tauri build produced no bundles"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  android:
    name: Android APK
    needs: [preflight, create-release]
    if: needs.preflight.outputs.android_signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # setup-android@v3 runs `sdkmanager tools`, and Google removed that package
      # from the SDK repository, so the action fails before the build starts. The
      # runner image already ships the SDK; accept its licences and install the
      # NDK the Rust target links against.
      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "ndk;27.0.12077973" "platform-tools"
      - uses: ./.github/actions/bun-install
        with:
          save: "true"
      - name: Materialise the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p .android-secrets
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .android-secrets/fluxy-release.jks
          # init regenerates gen/android, so it runs before the properties file
          # is written; the build script refuses a release build without it.
          bun x tauri android init
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/.android-secrets/fluxy-release.jks
          password=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-fluxy}
          EOF
      - name: Build the signed APKs
        # One APK per ABI, named after the target the Rust side was built for;
        # a universal APK would carry every ABI and no one can tell them apart.
        run: bun run android:build -- --release --split-per-abi --target aarch64 armv7 i686 x86_64
      - name: Upload the APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s target/android-apks.txt ]; then
            echo "::error::the build produced no APK manifest"
            exit 1
          fi
          while read -r abi apk; do
            asset="Fluxy-${TAG}-${abi}.apk"
            cp "$apk" "$asset"
            gh release upload "$TAG" "$asset" --clobber
          done < target/android-apks.txt

  publish:
    name: Publish the release
    needs: [create-release, desktop, android]
    # A skipped Android job must not block the desktop release; a failed one must.
    if: |
      always()
      && needs.create-release.result == 'success'
      && needs.desktop.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This job has no checkout, so gh cannot discover the repository from a
        # git remote; name it explicitly.
        run: gh release edit "$TAG" --draft=false --title "$TAG" -R "$GITHUB_REPOSITORY"
