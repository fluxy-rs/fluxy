name: Warm caches

# A merge to main does not need the test matrix again: the pull request already
# ran it against the same tree. What the next pull request needs is the
# dependency caches, so this workflow only fetches and compiles.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "src-tauri/Cargo.toml"
      - "tools/**/Cargo.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/warm-cache.yml"
  # A rustc update changes the cache key without touching any watched file;
  # without a periodic run the newest cache would belong to the previous
  # toolchain and every pull request would rebuild from scratch.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  warm:
    name: Warm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Unlike the pull request jobs this one saves: it runs on the default
      # branch, so its cache is the one pull requests restore.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/bun-install
        with:
          save: "true"
      # tauri-build embeds the frontend into the shell crate, so the bundle has
      # to exist before the workspace compiles.
      - run: bun run build:vite
      - run: cargo fetch
      # Check and build artefacts are separate and the pull request runs clippy
      # before the tests, so both halves have to be warmed for the restore to
      # cover its first step.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --exclude udp-chaos --all-targets
      # The decoder fuzz step is the only release-profile build in CI.
      - run: cargo build --release -p fluxy-core --tests

  # The release jobs restore this cache, so it has to hold the same artefacts
  # that "bun x tauri build" produces: the whole dependency graph in the release
  # profile. A version bump changes Cargo.lock and therefore the cache key, which
  # is why this runs on every merge that touches a dependency file.
  warm-release:
    name: Warm release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/bun-install
        with:
          save: "true"
      - run: bun x tauri build --no-bundle

  # The Android release job cannot warm this cache itself: a cache a tag run
  # creates lives under refs/tags/<tag>, and the next release has a different
  # tag, so it would never be restored. This builds the same APKs on the default
  # branch, whose caches tag runs can restore.
  warm-android:
    name: Warm Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "ndk;27.0.12077973" "platform-tools"
      - uses: ./.github/actions/bun-install
        with:
          save: "true"
      - name: Materialise the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the Android cache stays cold"
            exit 0
          fi
          mkdir -p .android-secrets
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .android-secrets/fluxy-release.jks
          bun x tauri android init
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/.android-secrets/fluxy-release.jks
          password=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-fluxy}
          EOF
          echo "save=true" >> "$GITHUB_OUTPUT"
      - if: steps.keystore.outputs.save == 'true'
        run: bun run android:build -- --release --split-per-abi --target aarch64 x86_64
