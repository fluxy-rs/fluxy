name: CI

# Pull requests are the only place the full matrix runs. A merge to main does
# not repeat it: the tree the merge produces is the one the pull request just
# tested, so the run that actually helps the next pull request is warm-cache.yml,
# which refills the dependency caches after the merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Incremental data is not part of the cached paths, so it only grows the build
  # directory and prints "could not be used" warnings after a cache restore.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that only edits Markdown has nothing for cargo or vitest to
  # check, and running the matrix anyway costs twenty minutes of runner time to
  # learn nothing.
  #
  # The filter asks "is every changed file documentation?" rather than "did
  # anything change in a code path?" - a path somebody forgot to list then runs
  # the gates instead of silently skipping them, which is the failure that would
  # actually matter.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            docs_only:
              - "**/*.md"
              - "docs/**"

  # The regression matrix the release needs: the same gates on all three
  # desktop platforms. A platform is only "green" if this job is green for it.
  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    # Skipped rather than absent: a required check that never reports leaves the
    # pull request blocked, while one reported as skipped counts as passed.
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # "desktop" lets the rust, e2e, bundle and release jobs share one cache per
      # platform instead of each compiling the workspace from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          # warm-cache.yml writes the cache after a merge; a pull request only
          # restores it so its run cannot evict anything the default branch owns.
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # tauri-build embeds the frontend, so the bundle directory has to exist
      # before any cargo command compiles the shell crate. Only the Vite half is
      # needed here: a full `tauri build` would recompile the whole shell for
      # every platform just to throw the artefacts away, and it drags in the
      # platform bundler toolchain this job does not otherwise require.
      - uses: ./.github/actions/bun-install
      - run: bun run build:vite
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # udp-chaos is left out on purpose: its fault-injection cases assert on
      # timing and on the shape of the local network stack, and a shared runner
      # does not provide either. It has its own job below.
      - run: cargo test --workspace --exclude udp-chaos
      - name: Decoder fuzz (20k mutations)
        run: cargo test -p fluxy-core --release --test decoder_fuzz

  web:
    name: Web
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - run: bun run check
      # Formatting is a gate, not a preference: a pull request that leaves the
      # tree unformatted would otherwise be normalised by the next person to
      # run `bun run format`, burying their real change in whitespace.
      - run: bun run check:format
      - run: bun run check:security
      - run: bun run check:docs
      - run: bun run check:versions
      - run: bun run test:frontend
      # The frontend bundle, not the app bundle: this job has no WebKitGTK, and
      # `tauri build` here failed with "Package glib-2.0 was not found". The
      # shell packaging is covered by the rust and release jobs.
      - run: bun run build:vite

  e2e:
    name: E2E (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end acceptance (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/e2e/run-e2e.sh local
      - name: End-to-end acceptance (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/e2e/run-e2e.ps1 local

  # The UDP fault injection suite needs a network stack it controls: it asserts
  # on chat latency while a transfer saturates the link, and on checkpointing
  # after a forced reconnect. On a shared runner those assertions race the host,
  # so it only runs on a manual dispatch. It needs no frontend and no bun: the
  # workspace it tests never builds the Tauri shell.
  chaos:
    name: UDP fault injection
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test -p udp-chaos

  # The Android track is expensive: an SDK, an NDK and a Gradle download are too
  # slow for every pull request, and a signed build is produced by release.yml.
  android:
    name: Android APK (debug)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: sdkmanager --install 'ndk;27.0.12077973' 'platform-tools'
      - uses: ./.github/actions/bun-install
      # The APK build runs beforeBuildCommand itself, so the frontend is built
      # there; doing it here as well only builds the bundle twice.
      - name: Build the debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bun x tauri android init
          bun x tauri android build --debug --apk --target aarch64
      - name: Check 16 KB alignment
        run: |
          set -e
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -1)
          mkdir -p /tmp/apk && unzip -o "$apk" -d /tmp/apk >/dev/null
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in /tmp/apk/lib/*/*.so; do
            echo "$so"
            "$readelf" -lW "$so" | awk '$1 == "LOAD" { print "  align " $NF }'
            "$readelf" -lW "$so" | awk '$1 == "LOAD" && $NF != "0x4000" { exit 1 }'
          done

  # Dependency and advisory policy is a release gate, and it needs the RustSec
  # database, so it runs on demand rather than on every push.
  audit:
    name: Dependency audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The packaging chain is slow and only matters for a release. --no-bundle
  # checks that the shell and frontend package together without needing the
  # signing or installer toolchains. release.yml does the real bundling.
  bundle:
    name: Bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/bun-install
      - run: bun x tauri build --no-bundle
