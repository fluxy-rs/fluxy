name: bun install
description: Install the frontend dependencies, restoring the bun package cache.

inputs:
  save:
    description: "true writes the cache; pull requests only restore."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3

    # Pull requests restore the default branch's cache but never write one of
    # their own: a per-PR cache is only ever visible to that same PR, so saving
    # it spends quota on something nobody else can use. warm-cache.yml owns the
    # saving side.
    - name: Restore the bun package cache
      if: inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Restore and save the bun package cache
      if: inputs.save == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install
      shell: bash
      run: bun install --frozen-lockfile
