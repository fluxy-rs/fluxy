[package]
name = "tauri-plugin-fluxy-mobile"
version.workspace = true
edition.workspace = true
description = "Platform bridges Fluxy needs on Android and iOS"
links = "tauri-plugin-fluxy-mobile"
license = "MIT"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.12"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]

[features]
default = []
