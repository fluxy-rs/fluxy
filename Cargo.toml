[workspace]
resolver = "2"
members = [
  "crates/fluxy-proto",
  "crates/fluxy-sysinfo",
  "crates/fluxy-core",
  "crates/fluxy-net",
  "crates/fluxy-app",
  "crates/fluxy-cli",
  "src-tauri",
  "plugins/tauri-plugin-fluxy-mobile",
  "tools/udp-chaos",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Fluxy contributors"]
rust-version = "1.85"

[workspace.dependencies]
# Free-space query for the pre-accept check: statvfs on unix (including
# Android), GetDiskFreeSpaceEx on Windows.
fs2 = "0.4"
# The version is repeated here because cargo-deny treats a path-only
# dependency as a wildcard, and an internal crate without a version cannot be
# published. Keep it in step with [workspace.package] version.
fluxy-proto = { path = "crates/fluxy-proto", version = "0.2.0" }
fluxy-core = { path = "crates/fluxy-core", version = "0.2.0" }
fluxy-net = { path = "crates/fluxy-net", version = "0.2.0" }
fluxy-app = { path = "crates/fluxy-app", version = "0.2.0" }

prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.10", features = [] }
getrandom = { version = "0.4", features = ["sys_rng"] }
blake3 = { version = "1", features = ["rayon"] }
rayon = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
rustls-pki-types = "1"
mdns-sd = "0.21"
if-addrs = "0.15"
default-net = "0.22"
socket2 = "0.6"
libc = "0.2"
arboard = { version = "3.7", default-features = false }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
